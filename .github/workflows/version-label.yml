name: Version label

# Every PR needs exactly one type label: it decides the release's version bump (tools/nextVersion.mjs), and without this
# a PR left unlabelled would quietly release as a patch. Runs again when labels change, without re-running the tests.
# Not on `opened`: `gh pr create --label` fires one `labeled` per label straight after, so that run only repeated them (#636). A PR opened
# with no labels has no Version label check until one is added, and can't merge without it, as the check is required.
on:
  pull_request:
    types: [synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# No concurrency group: cancelling an older run leaves a cancelled status on the commit, and that blocks auto-merge (#320).
# Every run reads the labels live, so each one reports the truth as of when it ran.

jobs:
  version-label:
    name: Version label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools
            mise.toml
      - name: Setup Node
        uses: jdx/mise-action@v5
      - name: Check the labels
        # Explicitly bash, which runs with pipefail, so the check's exit code survives the tee.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Read the labels now, not from the event: `gh pr create --label` opens the PR before it adds them, so the
          # `opened` payload (which a rerun reuses) can be empty.
          LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          tags=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||')
          latest=$(node tools/nextVersion.mjs --latest $tags)
          node tools/nextVersion.mjs --check "$latest" "$LABELS" | tee -a "$GITHUB_STEP_SUMMARY"
