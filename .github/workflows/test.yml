name: Test

on:
  pull_request: {}

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The unit tests (in three shards) and Smoke run side by side; Test waits for them all and is the one check main requires, so the required
# name never changes (#284, #286). Each checks out only the tree: the full history is gigabytes of audio, and nothing here reads it. The
# shards leave the recordings out and Smoke takes them from the cache (#640).
# Changes looks at the PR's files first: prose alone (tools/ciChanges.mjs) skips the shards and Smoke, and Test passes without them (#636).
jobs:
  Changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      # The runner's own Node: the script needs nothing from mise.toml, and this saves installing it.
      - name: Does it change anything but prose?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > files.txt || : > files.txt
          node tools/ciChanges.mjs < files.txt | tee -a "$GITHUB_OUTPUT"

  # A PR that says "Closes #n" needs every line of #n answered (tools/issueCheck.mjs, #736). It reads the issue live and runs on prose-only PRs too.
  Issue:
    name: Issue check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - name: Is every line of each issue this closes answered?
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/issueCheck.mjs pr ${{ github.event.pull_request.number }}

  Unit:
    name: Unit ${{ matrix.shard }}/3
    needs: Changes
    if: needs.Changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Let the other shards finish, so one red run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Without the recordings (the MP3s and FLACs in public/audio, the WAVs in source/audio): about 3 s and 28 MB, not 22 s and 310 MB.
      # The tests read the JSON beside them, never the audio itself; a test that starts to will find its file missing here (#640).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.mp3
            !*.flac
            !*.wav
      # The Node version in mise.toml, the same one used locally.
      - name: Setup Node
        uses: jdx/mise-action@v5
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'mise.toml') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: node --version && npm ci
      # A runner is two or three times slower than a laptop, so the heavy model tests need longer than the 5 s default.
      - name: Test
        run: npm test -- --testTimeout=30000 --shard=${{ matrix.shard }}/3

  Smoke:
    needs: Changes
    if: needs.Changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # The game plays its recordings, so they come back from the Actions cache rather than a fresh git fetch (#640).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.mp3
            !*.flac
            !*.wav
      - uses: ./.github/actions/audio
      - name: Setup Node
        uses: jdx/mise-action@v5
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'mise.toml') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: node --version && npm ci
      # The smoke test plays the built game when there is one, so this is also the check that it builds. With one commit checked out, the
      # FAQ's "Recently changed" has one entry; the release builds it again on main with 300.
      - name: Build
        run: npm run build
      # Runs the real game in headless Chrome (the runner's own) with software GL and fails on any error or oddity (tools/smoke.mjs).
      - name: Smoke test
        run: CHROME_PATH=$(which google-chrome) npm run smoke
        timeout-minutes: 12
      # The smoke test also holds the frame to its budget (draw calls and triangles from fixed spots, tools/frameBudget.mjs) and fails a PR over it.
      # This prints the numbers in the job summary with the change from main: main's numbers are the newest merge in the history the Release
      # workflow keeps, not main built and measured again here (#636). It never fails the job: with no history the table has no change column.
      - name: Frame budget against main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f budget-pr.json ] || { echo "No frame budget numbers: the smoke test stopped before measuring." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          tools/fetchBudgetHistory.sh history.json
          node tools/budget.mjs --summary budget-pr.json --history history.json >> "$GITHUB_STEP_SUMMARY"

  # always(): if a Unit shard or Smoke fails this would otherwise be skipped, and a skipped required check counts as passed. Skipped shards
  # and Smoke pass only when Changes ran and said the PR is prose alone.
  Test:
    needs: [Changes, Issue, Unit, Smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The issue check passed, and every shard and Smoke did, or the PR is prose alone
        run: |
          echo "Changes: ${{ needs.Changes.result }} (code ${{ needs.Changes.outputs.code }}), Issue: ${{ needs.Issue.result }}, Unit: ${{ needs.Unit.result }}, Smoke: ${{ needs.Smoke.result }}"
          [ "${{ needs.Changes.result }}" = success ] || exit 1
          [ "${{ needs.Issue.result }}" = success ] || exit 1
          [ "${{ needs.Changes.outputs.code }}" = false ] && exit 0
          [ "${{ needs.Unit.result }}" = success ] && [ "${{ needs.Smoke.result }}" = success ]
