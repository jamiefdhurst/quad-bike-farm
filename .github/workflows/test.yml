name: Test

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The unit tests (in three shards) and Smoke run side by side; Test waits for them all and is the one check main requires, so the required
# name never changes (#284, #286). Each checks out only the tree: the full history is gigabytes of audio, and nothing here reads it.
jobs:
  Unit:
    name: Unit ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      # Let the other shards finish, so one red run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # The Node version in mise.toml, the same one used locally.
      - name: Setup Node
        uses: jdx/mise-action@v5
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'mise.toml') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: node --version && npm ci
      # A runner is two or three times slower than a laptop, so the heavy model tests need longer than the 5 s default.
      - name: Test
        run: npm test -- --testTimeout=30000 --shard=${{ matrix.shard }}/3

  Smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: jdx/mise-action@v5
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'mise.toml') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: node --version && npm ci
      # The smoke test plays the built game when there is one, so this is also the check that it builds. With one commit checked out, the
      # FAQ's "Recently changed" has one entry; the release builds it again on main with 300.
      - name: Build
        run: npm run build
      # Runs the real game in headless Chrome (the runner's own) with software GL and fails on any error or oddity (tools/smoke.mjs).
      - name: Smoke test
        run: CHROME_PATH=$(which google-chrome) npm run smoke
        timeout-minutes: 12
      # The smoke test also holds the frame to its budget (draw calls and triangles from fixed spots, tools/frameBudget.mjs) and fails a PR over it.
      # This prints the numbers in the job summary with the change from main, measured the same way on main's build. It never fails the job:
      # if main can't be built or measured the table just has no change column.
      - name: Frame budget against main
        if: always()
        timeout-minutes: 12
        run: |
          [ -f budget-pr.json ] || { echo "No frame budget numbers: the smoke test stopped before measuring." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if git fetch --depth 1 origin main && git worktree add ../main-base FETCH_HEAD \
            && ln -s "$PWD/node_modules" ../main-base/node_modules && (cd ../main-base && npm run build); then
            CHROME_PATH=$(which google-chrome) node tools/budget.mjs --root ../main-base --dist dist --out budget-main.json || echo "main could not be measured"
          fi
          node tools/budget.mjs --summary budget-pr.json budget-main.json >> "$GITHUB_STEP_SUMMARY"

  # always(): if a Unit shard or Smoke fails this would otherwise be skipped, and a skipped required check counts as passed.
  Test:
    needs: [Unit, Smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and Smoke passed
        run: |
          echo "Unit: ${{ needs.Unit.result }}, Smoke: ${{ needs.Smoke.result }}"
          [ "${{ needs.Unit.result }}" = success ] && [ "${{ needs.Smoke.result }}" = success ]
