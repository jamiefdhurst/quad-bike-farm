# How GitHub groups a release's generated notes, by the merged PRs' labels (.github/settings.yml).
changelog:
  categories:
    - title: Breaking (old saves)
      labels: ["💥 breaking"]
    - title: New
      labels: ["✨ feature"]
    - title: Better
      labels: ["⚡ enhancement"]
    - title: Fixed
      labels: ["🐛 bug"]
    - title: Dependencies
      labels: ["⬆️ dependencies"]
    - title: Other
      labels: ["*"]
