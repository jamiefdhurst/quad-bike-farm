<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 150' width='960' height='450'>
<rect width='320' height='150' fill='#f4f4f2'/>
<text x='6' y='11' font-family='Helvetica, Arial, sans-serif' font-size='7' font-weight='bold' fill='#222'>Orange: Suzuki LT250R-style bare race bars</text>
<text x='6' y='20' font-family='Helvetica, Arial, sans-serif' font-size='4.6' fill='#555'>Nothing to read. A red kill switch on the left bar that flips RUN / OFF with the ignition (K), and a tether. A pod is the only way to see anything.</text>
