<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quad Bike Farm</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="overlay">
      <div class="overlay-card">
        <h1 class="visually-hidden">Quad Bike Farm, by Jamie Hurst</h1>
        <div class="start-logo" id="start-logo"></div>
        <p id="overlay-status">Loading…</p>
        <p class="overlay-hint" id="overlay-play">Click to play. Press H in game for controls.</p>
        <div class="start-farm" id="start-farm" hidden>
          <button type="button" class="start-continue" id="start-continue">Continue</button>
          <button type="button" class="start-new" id="start-new">New farm</button>
        </div>
        <p class="overlay-hint" id="overlay-pad"></p>
        <p class="start-tip" id="start-tip"></p>
        <div class="start-links">
          <button type="button" class="keys-open" id="keys-open">Change keys</button>
          <a class="start-faq" id="start-faq" href="faq.html" target="_blank" rel="noopener">How to play, and the FAQ</a>
        </div>
        <div class="keys-panel" id="keys-panel" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/start/startScreen.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
